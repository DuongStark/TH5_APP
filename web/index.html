<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF9F6" />
    <title>Mây — Trò chuyện</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='27'%3E☁%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg
      class="icon-definitions"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="m12 19-7-7 7-7M5 12h14" />
        </symbol>
        <symbol id="i-up" viewBox="0 0 24 24">
          <path d="M12 19V5m-7 7 7-7 7 7" />
        </symbol>
        <symbol id="i-right" viewBox="0 0 24 24">
          <path d="M5 12h14m-7-7 7 7-7 7" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="i-cloud" viewBox="0 0 24 24">
          <path
            d="M20 16.6A4.5 4.5 0 0 0 18 8a6 6 0 0 0-11.5-1A5 5 0 0 0 6 17h13"
          />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
          <rect x="4" y="10" width="16" height="12" rx="2" />
          <path d="M8 10V6a4 4 0 0 1 8 0v4m-4 6v2" />
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
          <path
            d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8Z"
          />
        </symbol>
        <symbol id="i-users" viewBox="0 0 24 24">
          <path
            d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"
          />
          <circle cx="9" cy="7" r="4" />
        </symbol>
        <symbol id="i-bell" viewBox="0 0 24 24">
          <path
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-11 12a2 2 0 0 0 4 0"
          />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path
            d="m9 3 1-1h4l1 3 3 1 3-1 2 4-2 2v3l2 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 2-2v-3L1 9l2-4 3 1 3-1Z"
            transform="translate(1 0) scale(.92)"
          />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="7.5" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="i-compose" viewBox="0 0 24 24">
          <path
            d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M16 3l5 5M10 14l-1 5 5-1L22 10a2.1 2.1 0 0 0-5-5Z"
          />
        </symbol>
        <symbol id="i-logout" viewBox="0 0 24 24">
          <path
            d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4m7-14 5 5-5 5M9 12h12"
          />
        </symbol>
      </defs>
    </svg>
    <div class="phone-slot">
      <main class="phone" aria-label="Ứng dụng Mây">
        <div class="status-bar" aria-hidden="true">
          <span id="clock">09:41</span
          ><span class="status-icons"
            ><svg viewBox="0 0 18 14"><path d="M0 4Q9-4 18 4L9 14Z" /></svg
            ><svg viewBox="0 0 14 14"><path d="M0 14 14 0v14Z" /></svg
            ><svg viewBox="0 0 9 16">
              <path d="M3 0h3v2h2v14H1V2h2Z" />
              <path d="m5 4-3 5h2l-1 4 4-6H5Z" fill="var(--background)" /></svg
          ></span>
        </div>
        <div id="global-error" class="error-banner" role="alert" hidden></div>
        <section id="loading-screen" class="loading-screen">
          <span class="spinner"></span>
          <p>Đang khôi phục phiên đăng nhập…</p>
        </section>
        <section id="auth-screen" class="auth-screen" hidden>
          <div class="brand">
            <svg class="icon"><use href="#i-cloud" /></svg><span>mây</span>
          </div>
          <div id="login-illustration" class="illustration" aria-hidden="true">
            <div class="illustration-circle"></div>
            <div class="preview-card">
              <img src="./assets/ngoc.jpg" alt="" />
              <div>
                <strong>Bảo Ngọc</strong>
                <p>Chiều đi cà phê nhé ☕</p>
              </div>
              <small>09:41</small>
            </div>
            <div class="preview-reply">
              Được chứ, hẹn bạn!<small>09:42</small>
            </div>
            <i></i>
          </div>
          <h1 id="auth-title">Đăng nhập</h1>
          <p id="auth-subtitle" class="subtitle">
            Cuộc trò chuyện đang chờ bạn.
          </p>
          <form id="auth-form" novalidate>
            <div id="name-field" hidden>
              <label for="full-name">Họ tên</label>
              <div class="field">
                <svg class="icon"><use href="#i-user" /></svg
                ><input
                  id="full-name"
                  placeholder="Nhập họ và tên"
                  maxlength="80"
                  autocomplete="name"
                />
              </div>
            </div>
            <label for="email">Email</label>
            <div class="field">
              <svg class="icon"><use href="#i-user" /></svg
              ><input
                id="email"
                type="email"
                placeholder="Email của bạn"
                maxlength="254"
                autocomplete="username"
                required
              />
            </div>
            <label for="password">Mật khẩu</label>
            <div class="field">
              <svg class="icon"><use href="#i-lock" /></svg
              ><input
                id="password"
                type="password"
                placeholder="Nhập mật khẩu"
                maxlength="128"
                autocomplete="current-password"
                required
              /><button
                id="toggle-password"
                type="button"
                class="eye-button"
                aria-label="Hiện mật khẩu"
              >
                <svg class="icon"><use href="#i-eye" /></svg>
              </button>
            </div>
            <div id="confirmation-field" hidden>
              <label for="confirmation">Nhập lại mật khẩu</label>
              <div class="field">
                <svg class="icon"><use href="#i-lock" /></svg
                ><input
                  id="confirmation"
                  type="password"
                  placeholder="Nhập lại mật khẩu"
                  maxlength="128"
                  autocomplete="new-password"
                />
              </div>
            </div>
            <p id="auth-error" class="form-error" role="alert" hidden></p>
            <button id="auth-submit" class="primary-button" type="submit">
              <span>Đăng nhập</span
              ><svg class="icon"><use href="#i-right" /></svg>
            </button>
          </form>
          <button id="switch-auth" class="text-button">
            Chưa có tài khoản? Đăng ký
          </button>
        </section>
        <section id="main-screen" class="main-screen" hidden>
          <div class="main-body">
            <header class="main-header">
              <div class="small-brand">
                <svg class="icon"><use href="#i-cloud" /></svg>mây
              </div>
              <div class="title-row">
                <h1 id="main-title">Tin nhắn</h1>
                <div id="self-avatar"></div>
              </div>
              <p id="main-subtitle" class="subtitle"></p>
            </header>
            <div id="search-box" class="search-field">
              <svg class="icon"><use href="#i-search" /></svg
              ><input
                id="search"
                placeholder="Tìm cuộc trò chuyện"
                aria-label="Tìm cuộc trò chuyện"
                autocomplete="off"
              />
            </div>
            <div id="active-section" class="active-section">
              <h2>ĐANG HOẠT ĐỘNG</h2>
              <div id="active-list" class="active-list"></div>
            </div>
            <div id="home-filters" class="filters">
              <button id="all-filter" class="filter selected">Tất cả</button
              ><button id="unread-filter" class="filter">Chưa đọc</button>
            </div>
            <div id="contacts-section" class="section-label" hidden>
              <h2>BẠN BÈ</h2>
              <span id="contacts-count"></span>
            </div>
            <div id="people-list" class="people-list"></div>
            <section id="settings-content" class="settings-content" hidden>
              <div id="profile-avatar"></div>
              <h2 id="profile-name"></h2>
              <p id="profile-email" class="subtitle"></p>
              <button id="logout-button" class="logout-button">
                <svg class="icon"><use href="#i-logout" /></svg>Đăng xuất
              </button>
            </section>
          </div>
          <button
            id="compose-button"
            class="compose-button"
            aria-label="Cuộc trò chuyện mới"
          >
            <svg class="icon"><use href="#i-compose" /></svg>
          </button>
          <nav class="tab-bar" aria-label="Màn hình chính">
            <button data-tab="home" class="active">
              <span class="tab-icon"
                ><svg class="icon"><use href="#i-chat" /></svg
                ><b id="tab-unread" hidden></b></span
              ><span>Tin nhắn</span></button
            ><button data-tab="contacts">
              <svg class="icon"><use href="#i-users" /></svg
              ><span>Danh bạ</span></button
            ><button data-tab="notifications">
              <svg class="icon"><use href="#i-bell" /></svg
              ><span>Thông báo</span></button
            ><button data-tab="settings">
              <svg class="icon"><use href="#i-settings" /></svg
              ><span>Cài đặt</span>
            </button>
          </nav>
        </section>
        <section id="chat-screen" class="chat-screen" hidden>
          <header class="chat-header">
            <button id="chat-back" class="icon-button" aria-label="Quay lại">
              <svg class="icon"><use href="#i-back" /></svg>
            </button>
            <div id="chat-avatar"></div>
            <div class="chat-header-info">
              <h1 id="peer-name"></h1>
              <p id="peer-status"></p>
            </div>
          </header>
          <div
            id="messages"
            class="messages"
            role="log"
            aria-label="Tin nhắn"
            aria-live="polite"
            aria-relevant="additions"
          ></div>
          <p id="chat-error" class="chat-error" role="alert" hidden></p>
          <p id="send-progress" class="send-progress" hidden>Đang xử lý…</p>
          <form id="composer" class="composer">
            <button
              id="location-button"
              type="button"
              class="location-button"
              aria-label="Gửi vị trí hiện tại"
            >
              📍</button
            ><textarea
              id="draft"
              placeholder="Viết tin nhắn..."
              aria-label="Tin nhắn"
              maxlength="2000"
              rows="1"
            ></textarea
            ><button
              id="send-button"
              class="send-button"
              type="submit"
              aria-label="Gửi tin nhắn"
              disabled
            >
              <svg class="icon"><use href="#i-up" /></svg>
            </button>
          </form>
        </section>
        <div class="android-navigation" aria-hidden="true">
          <span class="android-back"></span><span class="android-home"></span
          ><span class="android-recent"></span>
        </div>
      </main>
    </div>
    <script type="module" src="./boot.mjs"></script>
  </body>
</html>
